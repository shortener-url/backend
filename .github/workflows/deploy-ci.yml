name: Install to Remote Server

on:
  push:
    branches:
      - main

env:
  WORKSPACE_DIR: "~/workspace/shortener-url"
  SSH_CONNECTION: "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

jobs:
  copy_files:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2    

    - name: Set up SSH
      uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Extract repository name
      id: extract_repo     
      run: echo "repo_name=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)" >> $GITHUB_ENV

    - name: Remove existing directory if it exists and create new one
      run: |
        ssh -o StrictHostKeyChecking=no ${{ env.SSH_CONNECTION }} "
          rm -rf ${{ env.WORKSPACE_DIR }}/${{ env.repo_name }} &&
          mkdir -p ${{ env.WORKSPACE_DIR }}/${{ env.repo_name }}
        "

    - name: Copy files to remote server
      run: |
        scp -r -o StrictHostKeyChecking=no "$(pwd)"/* ${{ env.SSH_CONNECTION }}:${{ env.WORKSPACE_DIR }}/${{ env.repo_name }}

  build:
    runs-on: ubuntu-latest
    needs: copy_files

    steps:
    - name: Set up SSH
      uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Build with Docker Compose
      run: |
        ssh -o StrictHostKeyChecking=no ${{ env.SSH_CONNECTION }} "
          cd ${{ env.WORKSPACE_DIR }}/${{ env.repo_name }} &&          
          export DB_POSTGRES_HOST=${{ secrets.DB_POSTGRES_HOST }} &&
          export DB_POSTGRES_PASS=${{ secrets.DB_POSTGRES_PASS }} &&
          export DB_POSTGRES_USER=${{ secrets.DB_POSTGRES_USER }} &&
          export BRANCH_REPO=main &&
          docker compose build --no-cache
        "

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Set up SSH
      uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy with Docker Compose
      run: |
        ssh -o StrictHostKeyChecking=no ${{ env.SSH_CONNECTION }} "
          cd ${{ env.WORKSPACE_DIR }}/${{ env.repo_name }} &&
          docker compose up -d --force-recreate
        "
